<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Odds-API pane at sidebar width</title>
<style>
  body { margin: 0; display: flex; gap: 24px; padding: 16px; background: #e8eaed; font: 12px system-ui; }
  .sidebar { width: 300px; height: 760px; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgb(0 0 0 / .2); overflow: hidden; display: flex; flex-direction: column; }
  .chrome { height: 40px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #dadce0; font: 500 14px system-ui; color: #202124; }
  iframe { flex: 1; border: 0; width: 300px; }
</style>
</head>
<body>
  <div class="sidebar"><div class="chrome">Odds-API</div><iframe id="pane"></iframe></div>
  <script>document.getElementById('pane').src = '/' + location.search + location.hash</script>
</body>
</html>
